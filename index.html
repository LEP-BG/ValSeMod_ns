<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Set remaining slots for each survey link:
    const links = [
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0001 ", weight: 11 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0002 ", weight: 10 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0003 ", weight: 12 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0013 ", weight: 8 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0014 ", weight: 10 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0015 ", weight: 10 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0028 ", weight: 10 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0029 ", weight: 13 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0030 ", weight: 10 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0040 ", weight: 5 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0041 ", weight: 8 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0042 ", weight: 10 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0046 ", weight: 11 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0047 ", weight: 11 },
      { url: "https://www.soscisurvey.de/valsemod/?q=qnr0048 ", weight: 13 }
    ];

    // Calculate total weight (415)
    const totalWeight = links.reduce((sum, item) => sum + item.weight, 0);
    
    // Pick a random number between 0 and totalWeight - 1
    let randomNum = Math.floor(Math.random() * totalWeight);
    let selectedUrl = links[0].url;

    for (const item of links) {
      if (randomNum < item.weight) {
        selectedUrl = item.url;
        break;
      }
      randomNum -= item.weight;
    }

    // Redirect to chosen link
    window.location.href = selectedUrl;
  </script>
</head>
<body>
  <p>Redirecting you to the study...</p>
</body>
</html>
